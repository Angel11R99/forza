name: Pull request checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  policy:
    name: contribution-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check issue approval, branch and competing PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_STATE: ${{ github.event.pull_request.draft }}
        run: python .github/scripts/validate_pr.py
      - name: Mark authorized work as in review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(python -c 'import os,re; m=re.search(r"(?im)^\s*(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#(\d+)\b",os.environ.get("PR_BODY") or ""); print(m.group(1) if m else "")')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GH_REPO" --remove-label status:approved --remove-label status:in-progress --add-label status:in-review
          fi
  flutter:
    name: flutter-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - run: npm ci --prefix firebase-tests
      - name: Test Firestore rules in the Emulator Suite
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-forza-firestore-rules "npm test --prefix firebase-tests"
