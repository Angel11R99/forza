name: Publicar APK de Android
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Tipo de cambio para esta versión
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release request and signing secrets
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TYPE" == "patch" || "$RELEASE_TYPE" == "minor" || "$RELEASE_TYPE" == "major" ]] || { echo 'Select patch, minor or major.' >&2; exit 1; }
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || { echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets.' >&2; exit 1; }
          LATEST_RELEASE=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$LATEST_RELEASE" ]]; then
            BASE_VERSION=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml)
            [[ -n "$BASE_VERSION" ]] || { echo 'Could not read the base version from pubspec.yaml.' >&2; exit 1; }
            LATEST_RELEASE="v$BASE_VERSION"
            echo "No previous GitHub Release found; using pubspec.yaml baseline $LATEST_RELEASE."
          fi
          VERSION=$(python .github/scripts/next_release_version.py "$LATEST_RELEASE" "$RELEASE_TYPE")
          echo "Publishing $RELEASE_TYPE release $VERSION (previous: $LATEST_RELEASE)."
          ! git tag -l "$VERSION" | grep -q . || { echo "Tag $VERSION already exists." >&2; exit 1; }
          ! gh release view "$VERSION" >/dev/null 2>&1 || { echo "Release $VERSION already exists." >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forza-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/forza-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build signed production APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
      - name: Create tag and publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/forza-${VERSION}.apk"
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" "dist/forza-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FORZA $VERSION" --generate-notes
